name: Build xow-win

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [ ARM64, x64 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A ${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release

      - name: Build xow-win
        run: cmake --build build --config Release

      - name: Package Release
        shell: pwsh
        run: |
          $pkgDir = "xow-win-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $pkgDir -Force
          Copy-Item -Path "bin\xow-win.exe" -Destination $pkgDir -Force
          Copy-Item -Path "driver" -Destination $pkgDir -Recurse -Force
          Copy-Item -Path "firmware" -Destination $pkgDir -Recurse -Force
          Copy-Item -Path "scripts" -Destination $pkgDir -Recurse -Force
          Copy-Item -Path "README.md", "LICENSE" -Destination $pkgDir -Force
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "xow-win-${{ matrix.arch }}.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xow-win-${{ matrix.arch }}
          path: xow-win-${{ matrix.arch }}.zip

      - name: Publish Release Asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: xow-win-${{ matrix.arch }}.zip
