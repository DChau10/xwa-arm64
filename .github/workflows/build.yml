name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (ARM64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A ARM64 -DCMAKE_BUILD_TYPE=Release

      - name: Build xwa-arm64
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $pkgDir = "xwa-arm64-ARM64"
          New-Item -ItemType Directory -Path $pkgDir -Force
          Copy-Item -Path "bin\xwa-arm64.exe" -Destination $pkgDir -Force
          Copy-Item -Path "driver" -Destination $pkgDir -Recurse -Force
          Copy-Item -Path "scripts" -Destination $pkgDir -Recurse -Force
          Copy-Item -Path "README.md", "LICENSE" -Destination $pkgDir -Force
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "xwa-arm64-ARM64.zip" -Force
          # Generate SHA-256 checksum
          (Get-FileHash -Path "xwa-arm64-ARM64.zip" -Algorithm SHA256).Hash | Out-File -FilePath "xwa-arm64-ARM64.zip.sha256" -Encoding ascii

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xwa-arm64-ARM64
          path: |
            xwa-arm64-ARM64.zip
            xwa-arm64-ARM64.zip.sha256
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: xwa-arm64-ARM64

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # If the release was already created as a draft in the web UI:
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release draft exists for $TAG. Uploading assets..."
            gh release upload "$TAG" xwa-arm64-ARM64.zip xwa-arm64-ARM64.zip.sha256 --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --draft=false $PRERELEASE_FLAG
          else
            echo "Creating new release for $TAG..."
            # Create as draft with assets attached first, then publish (required for Immutable Releases)
            gh release create "$TAG" xwa-arm64-ARM64.zip xwa-arm64-ARM64.zip.sha256 \
              --repo "$REPO" \
              --draft \
              --generate-notes \
              $PRERELEASE_FLAG
            gh release edit "$TAG" --repo "$REPO" --draft=false
          fi
